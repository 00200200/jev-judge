[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-judge"
version = "0.1.0"
description = "Vitest for LLM outputs. Sub-100ms, deterministic CI/CD evaluations powered by TypeSafe Jev."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "jev-judge contributors" }
]
keywords = [
    "evals",
    "llm-as-a-judge",
    "typesafe",
    "jev",
    "rag",
    "ci-cd",
    "testing",
    "ai-agents",
    "fast-eval",
    "benchmarking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "click>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
jev-judge = "jev_judge.cli:main"

[project.entry-points.pytest11]
jev_judge = "jev_judge.fixtures"

[tool.hatch.build.targets.wheel]
packages = ["jev_judge"]

[tool.pytest.ini_options]
addopts = "-p no:deepeval"
testpaths = ["tests"]
